{% extends "base.html" %}

{% block contenido %}
<h2 class="mb-4">Editar Usuario</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo *</label>
                <input type="text" class="form-control" id="nombre" name="nombre" 
                       value="{{ usuario.nombre }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" value="{{ usuario.correo }}" disabled>
                <small class="text-muted">El correo no se puede modificar</small>
            </div>
            
            {% if session.es_admin %}
            <div class="mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="es_admin" name="es_admin"
                           {% if usuario.es_admin %}checked{% endif %}>
                    <label class="form-check-label" for="es_admin">
                        Es Administrador
                    </label>
                </div>
            </div>
            {% endif %}
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="{{ url_for('usuarios.lista') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
