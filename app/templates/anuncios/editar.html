{% extends "base.html" %}

{% block contenido %}
<h2>Editar Anuncio</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" value="{{ anuncio.titulo }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select name="categoria_id" class="form-select" required>
            {% for cat in categorias %}
            <option value="{{ cat.id }}" {% if cat.id == anuncio.categoria_id %}selected{% endif %}>
                {{ cat.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Contenido</label>
        <textarea name="contenido" class="form-control" rows="5" required>{{ anuncio.contenido }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    <a href="{{ url_for('anuncios.lista') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
